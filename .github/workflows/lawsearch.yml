name: Law search (daily)
on:
  schedule:
    - cron: "17 2 * * *"   # 07:47 IST every day
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: lawsearch
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Search
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 _dev/lawsearch/search.py
      - name: Save new updates
        run: |
          if ! git diff --quiet -- law_updates.json; then
            git config user.name "law-search-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add law_updates.json
            git commit -m "Daily law search: new updates"
            git push
          else
            echo "nothing new"
          fi
